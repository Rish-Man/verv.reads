media:
  input: images
  output: images
  publicPath: /images
  rename: true

content:
  - name: stories
    label: Stories
    type: collection
    path: _stories
    filename: "{primary}.md"
    view:
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date (use format YYYY-MM-DD, e.g. 2026-10-15)
        type: string
        required: true
      - name: teaser
        label: Short teaser (one line)
        type: string
      - name: body
        label: Story body
        type: rich-text
        required: true

  - name: jokes
    label: Jokes
    type: collection
    path: _jokes
    filename: "{primary}.md"
    view:
      fields: [setup, date]
    fields:
      - name: setup
        label: Setup line
        type: string
        required: true
      - name: punchlines
        label: Punchlines
        type: object
        list: true
        fields:
          - name: line
            label: Punchline
            type: string
            required: true
      - name: date
        label: Date (use format YYYY-MM-DD, e.g. 2026-10-15)
        type: string
        required: true

  - name: songs
    label: Song Highlights
    type: collection
    path: _songs
    filename: "{primary}.md"
    view:
      fields: [title, artist]
    fields:
      - name: title
        label: Song title
        type: string
        required: true
      - name: artist
        label: Artist
        type: string
        required: true
      - name: youtube
        label: YouTube Video ID (the code after v= or youtu.be/ — before any ?)
        type: string
        required: true
      - name: body
        label: Why I love it
        type: text
        required: true
      - name: date
        label: Date (use format YYYY-MM-DD, e.g. 2026-10-15)
        type: string
        required: true

  - name: food
    label: The Eats
    type: collection
    path: _food
    filename: "{primary}.md"
    view:
      fields: [name]
    fields:
      - name: name
        label: Dish name
        type: string
        required: true
      - name: image
        label: Dish photo (upload)
        type: image
        required: true
      - name: alt_names
        label: Also known as (comma separated)
        type: string
      - name: about
        label: About this dish
        type: text
        required: true
      - name: recipe_url
        label: Recipe link (full URL)
        type: string
        required: true
      - name: recipe_source
        label: Recipe source (e.g. "BBC Good Food", "My grandmother")
        type: string
      - name: date
        label: Date (use format YYYY-MM-DD, e.g. 2026-10-15)
        type: string
        required: true
