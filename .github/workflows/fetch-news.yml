name: Fetch News Feeds
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch RSS feeds and save to JSON
        run: |
          npm install rss-parser
          node -e "
          const Parser = require('rss-parser');
          const fs = require('fs');
          const parser = new Parser({
            headers: {
              'User-Agent': 'Mozilla/5.0 (compatible; VervNews/1.0)',
              'Accept': 'application/rss+xml, application/xml, text/xml, */*'
            }
          });
          
          const feeds = [
            { name: 'world', url: 'https://www.thehindu.com/news/international/feeder/default.rss' },
            { name: 'india', url: 'https://www.thehindu.com/feeder/default.rss' },
            { name: 'bangalore', url: 'https://www.thehindu.com/news/cities/bangalore/feeder/default.rss' },
            { name: 'mumbai', url: 'https://www.thehindu.com/news/cities/mumbai/feeder/default.rss' },
            { name: 'delhi', url: 'https://www.thehindu.com/news/cities/Delhi/feeder/default.rss' },
            { name: 'up', url: 'https://www.thehindu.com/news/national/other-states/feeder/default.rss' }
          ];
          
          (async () => {
            for (const feed of feeds) {
              try {
                const parsed = await parser.parseURL(feed.url);
                const items = parsed.items.slice(0, 8).map(item => ({
                  title: item.title,
                  link: item.link,
                  date: item.pubDate || item.isoDate || item.date || null
                }));
                fs.writeFileSync('news-' + feed.name + '.json', JSON.stringify({ source: feed.name, items }, null, 2));
                console.log('Saved ' + items.length + ' items for ' + feed.name);
              } catch (err) {
                console.error('Error fetching ' + feed.name + ':', err.message);
                fs.writeFileSync('news-' + feed.name + '.json', JSON.stringify({ source: feed.name, items: [] }));
              }
            }
          })();
          "

      - name: Commit news files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update news feeds"
          file_pattern: "news-*.json"
