<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile | Verv</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@300;400;600&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('originals-bg.png.avif');
            background-color: #fcf6e8;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c2a26;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .profile-box {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(44, 42, 38, 0.15);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        .profile-box h1 {
            font-family: 'Abril Fatface', cursive;
            font-size: 2.5rem;
            color: #1a1815;
            margin-bottom: 10px;
        }
        .profile-box p {
            font-size: 0.95rem;
            color: #6a6760;
            margin-bottom: 25px;
        }
        .user-email {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a1815;
            margin-bottom: 30px;
            word-break: break-all;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1a1815;
            color: #fcf6e8;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        button:hover { background: #000; }
        .back-link {
            display: inline-block; color: #6a6760;
            text-decoration: none; font-size: 0.85rem;
        }
        .back-link:hover { color: #1a1815; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="profile-box">
        <h1>Your Profile</h1>
        <p>You are logged in as:</p>
        <span class="user-email" id="user-email">Loading...</span>
        
        <button id="logout-btn">Log Out</button>
        <br>
        <a href="/verv.reads/index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://tujxkdzqbswrsvcjrnvx.supabase.co'
        const supabaseKey = 'sb_publishable_iqxzx373BPW-yI-MsA_27A_PvsQdGox'
        const supabase = createClient(supabaseUrl, supabaseKey)

        const emailEl = document.getElementById('user-email')
        const logoutBtn = document.getElementById('logout-btn')

        // Check if user is logged in
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                emailEl.textContent = session.user.email
            } else {
                // If not logged in, kick them back to the login page
                window.location.href = '/verv.reads/login.html'
            }
        })

        // Handle Logout
        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut()
            window.location.href = '/verv.reads/index.html'
        })
    </script>
</body>
</html>
