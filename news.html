<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Headlines from around the web — curated and clean.">
    <meta property="og:site_name" content="Verv">
    <meta property="og:title" content="News | Verv">
    <meta property="og:description" content="Headlines from around the web — curated and clean.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rish-man.github.io/verv.reads/news.html">

    <link rel="icon" type="image/png" href="verv-favicon.png">
    <link rel="apple-touch-icon" href="verv-favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@300;400;600&family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; }

        body {
            background-image: url('originals-bg.png.avif');
            background-color: #fcf6e8;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c2a26;
            line-height: 1.8;
            overflow-x: hidden;
            animation: fadeInPage 0.8s ease forwards;
            opacity: 0;
            -webkit-text-size-adjust: 100%;
        }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }

        a { text-decoration: none; }
        a:visited { text-decoration: none; }

        body::before {
            content: '';
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.12) 100%);
            z-index: -1; pointer-events: none;
        }

        .back-btn {
            position: fixed; top: 20px; left: 20px;
            padding: 10px 20px;
            background: rgba(44, 42, 38, 0.1);
            color: #2c2a26 !important; border-radius: 50px;
            font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            transition: background 0.3s ease, transform 0.3s ease;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: rgba(44, 42, 38, 0.2); transform: translateX(-3px); color: #2c2a26 !important; }

        .page-wrapper {
            max-width: 720px;
            margin: 0 auto;
            padding: clamp(100px, 15vw, 120px) 5vw 60px 5vw;
        }

        .page-heading {
            font-family: 'Abril Fatface', cursive;
            font-size: clamp(2.5rem, 10vw, 4rem);
            color: #1a1815 !important; line-height: 1.1;
            text-align: center; margin-bottom: 18px;
        }

        .page-subtitle {
            text-align: center; color: #6a6760 !important;
            margin-bottom: 50px; font-size: clamp(0.95rem, 2.5vw, 1.05rem);
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .news-item {
            display: block;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(44, 42, 38, 0.1);
            border-radius: 12px;
            padding: clamp(18px, 3vw, 24px) clamp(20px, 3vw, 28px);
            color: inherit;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .news-item:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            color: inherit;
        }

        .news-item .news-source {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a8781 !important;
            margin-bottom: 6px;
        }

        .news-item .news-title {
            display: block;
            font-family: 'Josefin Sans', sans-serif;
            font-size: clamp(1rem, 2.6vw, 1.15rem);
            font-weight: 500;
            color: #1a1815 !important;
            line-height: 1.4;
        }

        .news-thumbnail {
            margin-top: 14px;
            border-radius: 8px;
            overflow: hidden;
            max-width: 100%;
            background: rgba(44, 42, 38, 0.05);
        }

        .news-thumbnail img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .news-loading {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 1rem;
            color: #8a8781 !important;
            text-align: center;
            font-style: italic;
            padding: 40px 0;
        }

        .follow-btn {
            position: fixed; bottom: 20px; right: 20px;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 20px;
            background: #2c2a26 !important; color: #fcf6e8 !important;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem; font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 999;
            -webkit-tap-highlight-color: transparent;
        }
        .follow-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.35); color: #fcf6e8 !important; }
        .follow-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

        footer {
            background: #fcf6e8;
            padding: 45px 5vw 35px 5vw;
            text-align: center;
            border-top: 1px solid rgba(44, 42, 38, 0.1);
            margin-top: 60px;
        }

        .footer-inner {
            max-width: 900px;
            margin: 0 auto;
        }

        .footer-logo {
            font-family: 'Abril Fatface', cursive;
            font-size: 1.5rem;
            color: #1a1815 !important;
            margin-bottom: 18px;
            display: block;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px 20px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .footer-links a {
            color: #6a6760 !important;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            padding: 6px 0;
            -webkit-tap-highlight-color: transparent;
        }
        .footer-links a:hover { color: #1a1815 !important; }

        .footer-links .divider-dot { color: #b0aca0; font-size: 0.8rem; }

        .footer-copyright {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.75rem;
            color: #8a8781 !important;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.8rem; }
            .follow-btn { bottom: 15px; right: 15px; padding: 10px 16px; font-size: 0.75rem; gap: 6px; }
            .follow-btn svg { width: 14px; height: 14px; }
            footer { padding: 40px 5vw 30px 5vw; }
            .footer-links { flex-direction: column; gap: 4px; }
            .footer-links .divider-dot { display: none; }
            .footer-links a { padding: 8px 0; }
        }
    </style>
</head>
<body>

    <a href="originals.html" class="back-btn">← Back to The Originals</a>

    <div class="page-wrapper">
        <h1 class="page-heading">News</h1>
        <p class="page-subtitle">Headlines from around the web. Updated automatically every few hours.</p>

        <div id="news-list" class="news-list">
            <p class="news-loading">Loading headlines...</p>
        </div>
    </div>

    <footer>
        <div class="footer-inner">
            <a href="index.html" class="footer-logo">Verv</a>
            
            <div class="footer-links">
                <a href="originals.html">Stories</a>
                <span class="divider-dot">•</span>
                <a href="jokes.html">Jokes</a>
                <span class="divider-dot">•</span>
                <a href="songs.html">Songs</a>
                <span class="divider-dot">•</span>
                <a href="news.html">News</a>
                <span class="divider-dot">•</span>
                <a href="https://rish-man.github.io/SDG-Theme-based-Games/" target="_blank">SDG Games</a>
                <span class="divider-dot">•</span>
                <a href="https://instagram.com/verv.reads" target="_blank">Instagram</a>
            </div>

            <p class="footer-copyright">© 2026 Verv · Made with care · No cookies, no tracking</p>
        </div>
    </footer>

    <a href="https://instagram.com/verv.reads" target="_blank" class="follow-btn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#FEDA75"/>
                    <stop offset="25%" stop-color="#FA7E1E"/>
                    <stop offset="50%" stop-color="#D62976"/>
                    <stop offset="75%" stop-color="#962FBF"/>
                    <stop offset="100%" stop-color="#4F5BD5"/>
                </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="url(#igGrad)" stroke-width="2" fill="none"/>
            <circle cx="12" cy="12" r="4.5" stroke="url(#igGrad)" stroke-width="2" fill="none"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="url(#igGrad)"/>
        </svg>
        <span>@verv.reads</span>
    </a>

    <script>
        fetch('news.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('news-list');
                let items = [];
                if (data && data.items && data.items.length > 0) {
                    items = data.items;
                } else if (Array.isArray(data) && data.length > 0) {
                    data.forEach(feed => {
                        if (feed.items) items = items.concat(feed.items);
                    });
                }

                if (items.length > 0) {
                    container.innerHTML = items.map(item => {
                        // Try to find an image from various possible RSS fields
                        let imgSrc = null;
                        if (item.enclosure && item.enclosure.link) {
                            imgSrc = item.enclosure.link;
                        } else if (item.enclosure && item.enclosure.url) {
                            imgSrc = item.enclosure.url;
                        } else if (item['media:content'] && item['media:content'].$ && item['media:content'].$.url) {
                            imgSrc = item['media:content'].$.url;
                        } else if (item['media:thumbnail'] && item['media:thumbnail'].$ && item['media:thumbnail'].$.url) {
                            imgSrc = item['media:thumbnail'].$.url;
                        } else if (item.content && item.content.match(/<img[^>]+src="([^">]+)"/)) {
                            imgSrc = item.content.match(/<img[^>]+src="([^">]+)"/)[1];
                        } else if (item['content:encoded'] && item['content:encoded'].match(/<img[^>]+src="([^">]+)"/)) {
                            imgSrc = item['content:encoded'].match(/<img[^>]+src="([^">]+)"/)[1];
                        }

                        return `
                            <a href="${item.link}" target="_blank" rel="noopener" class="news-item">
                                <span class="news-source">The Hindu</span>
                                <span class="news-title">${item.title}</span>
                                ${imgSrc ? `
                                    <div class="news-thumbnail">
                                        <img src="${imgSrc}" alt="${item.title}" loading="lazy" onerror="this.parentElement.style.display='none'">
                                    </div>
                                ` : ''}
                            </a>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<p class="news-loading">No headlines yet — check back soon.</p>';
                }
            })
            .catch(() => {
                document.getElementById('news-list').innerHTML = '<p class="news-loading">No headlines yet — check back soon.</p>';
            });
    </script>

</body>
</html>
