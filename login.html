<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Verv</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@300;400;600&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('originals-bg.png.avif');
            background-color: #fcf6e8;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c2a26;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(44, 42, 38, 0.15);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        .login-box h1 {
            font-family: 'Abril Fatface', cursive;
            font-size: 2.5rem;
            color: #1a1815;
            margin-bottom: 10px;
        }
        .login-box p {
            font-size: 0.95rem;
            color: #6a6760;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid rgba(44, 42, 38, 0.2);
            border-radius: 8px;
            background: #fff;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 1rem;
            color: #2c2a26;
        }
        input:focus { outline: none; border-color: #1a1815; }
        button {
            width: 100%;
            padding: 14px;
            background: #1a1815;
            color: #fcf6e8;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #000; }
        .message { margin-top: 15px; font-size: 0.85rem; min-height: 20px; }
        .success { color: #15803d; }
        .error { color: #b91c1c; }
        .back-link {
            display: inline-block; margin-top: 25px; color: #6a6760;
            text-decoration: none; font-size: 0.85rem;
        }
        .back-link:hover { color: #1a1815; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box" id="auth-form-container">
        <h1>Welcome.</h1>
        <p>Enter your email to log in or sign up.</p>
        
        <form id="auth-form">
            <!-- PASSWORD FIELD IS GONE -->
            <input type="email" id="email" placeholder="you@example.com" required>
            <button type="submit" id="submit-btn">Send Login Link</button>
        </form>
        
        <div class="message" id="message"></div>
        <a href="/verv.reads/index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://tujxkdzqbswrsvcjrnvx.supabase.co'
        const supabaseKey = 'sb_publishable_iqxzx373BPW-yI-MsA_27A_PvsQdGox'
        const supabase = createClient(supabaseUrl, supabaseKey)

        const authForm = document.getElementById('auth-form')
        const messageEl = document.getElementById('message')
        const emailInput = document.getElementById('email')
        const submitBtn = document.getElementById('submit-btn')

        // If already logged in, go straight to profile
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = '/verv.reads/profile.html'
        })

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            submitBtn.textContent = 'Sending...'
            submitBtn.disabled = true
            messageEl.textContent = ''
            messageEl.className = 'message'

            const { error } = await supabase.auth.signInWithOtp({
                email: emailInput.value,
                options: {
                    emailRedirectTo: 'https://rish-man.github.io/verv.reads/profile.html'
                }
            })

            if (error) {
                messageEl.textContent = error.message
                messageEl.className = 'message error'
            } else {
                messageEl.textContent = 'Check your email for the login link!'
                messageEl.className = 'message success'
            }

            submitBtn.textContent = 'Send Login Link'
            submitBtn.disabled = false
        })
    </script>
</body>
</html>
